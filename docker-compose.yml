# One command gets you the whole offline-first stack:
#   docker compose up --build   →  http://localhost:8080
#
# `web` serves the built PWA and proxies /api to `api`, so the browser talks to a
# single origin and no CORS is involved.
services:
  api:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    environment:
      NODE_ENV: production
      OUTPOST_DB: /data/outpost.db
      # Demo convenience: the inspector's "Reset server" button. Set to "false"
      # (or drop the variable) for anything that is not a demo.
      ALLOW_RESET: 'true'
    volumes:
      - outpost-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '8080:8080'
    restart: unless-stopped

volumes:
  outpost-data:
