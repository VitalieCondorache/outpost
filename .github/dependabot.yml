# Keeps the dependency surface visible instead of letting it drift. The interesting
# list is short on purpose: react, react-dom and idb are all the app ships.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
